name: Static analysis

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Ruff
        run: python -m pip install ruff

      - name: Check Python
        run: |
          python -m compileall -q copy_path.py
          ruff check --select E9,F copy_path.py

      - name: Check shell script
        run: shellcheck install.sh
